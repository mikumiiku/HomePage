{{define "extra_head"}}<link rel="stylesheet" href="/static/css/games.css?v={{.Ver}}">{{end}}

{{define "content"}}
<div class="game-shell">
  <a class="back-link" href="/">← 返回导航</a>
  <div class="game-title-row">
    <span class="icon-chip icon-chip-sm" style="--accent:#7fa3b8;--icon:url(/static/img/info.svg?v={{.Ver}})" aria-hidden="true"></span>
    <h1 class="game-heading">关于</h1>
  </div>
  <div class="about-body">
    <p>这是一个个人小站。目前有「小游戏」板块，收录多款自制小游戏；之后会陆续加入其他小应用和工具。</p>
    <p>站点用 Go 标准库手写，无第三方依赖。所有游戏进度只保存在你自己的浏览器（localStorage）里，服务端不存储任何数据——清理浏览器数据会丢档。</p>
    <p>游戏图标来自 <a href="https://game-icons.net/" rel="noopener">game-icons.net</a>（Lorc、Delapouite、Faithtoken，CC BY 3.0）。</p>
  </div>
</div>
{{end}}
